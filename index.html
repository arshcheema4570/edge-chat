<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0f">
  <meta name="description" content="Minimal private image chat powered by a local LiteRT-LM model.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=7">
  <title>Edge Chat</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><div><strong>Edge Chat</strong><span>SmolVLM2 · LiteRT-LM</span></div></div>
      <button id="clearButton" class="icon-button" type="button" title="Clear chat" aria-label="Clear chat">⌫</button>
    </header>

    <section class="model-card">
      <div class="eyebrow">LOCAL MODEL</div>
      <h1>Private image chat</h1>
      <p class="muted">SmolVLM2-500M runs through your LiteRT-LM server. Images and messages stay local to that server.</p>
      <label class="endpoint-label" for="endpointInput">LiteRT-LM endpoint</label>
      <div class="endpoint-row"><input id="endpointInput" type="url" spellcheck="false"><button id="connectButton" class="primary-button" type="button">Connect</button></div>
      <p id="statusText" class="status" role="status">Not connected</p>
    </section>

    <section id="chatLog" class="chat-log" aria-live="polite">
      <div id="emptyState" class="empty-state"><span>◌</span><h2>Ready for a photo</h2><p>Attach an image, ask a question, and send.</p></div>
    </section>

    <form id="composer" class="composer">
      <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp">
      <textarea id="promptInput" rows="1" maxlength="4000" placeholder="Ask about an image…"></textarea>
      <button id="sendButton" class="send-button" type="submit" aria-label="Send">↑</button>
    </form>
    <p class="footer-note" id="footerNote">Model: smolvlm2-500m · LiteRT-LM · 4-bit · 344 MiB</p>
  </main>
  <script type="module" src="./app.js?v=7"></script>
</body>
</html>
